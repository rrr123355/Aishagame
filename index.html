<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title data-translate="title">Tic Tac Toe - Ultimate Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* আপনার আগের সব CSS এখানে থাকবে (অপরিবর্তিত) */
        * {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
            margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif;
        }
        :root {
            --bg-color: #e0e5ec; --text-color: #3a3a3a; --primary-accent-color-x: #007bff; 
            --primary-accent-color-x-dark: #0056b3; --secondary-accent-color-o: #d946ef; 
            --secondary-accent-color-o-dark: #a21caf; --highlight-color: #ffc107; 
            --shadow-light: #ffffff; --shadow-dark: #a3b1c6; --border-radius: 15px;
            --neu-blur: 15px; --neu-distance: 8px;
        }
        body.dark-theme {
            --bg-color: #2c3e50; --text-color: #ecf0f1; --shadow-light: #3a506b; --shadow-dark: #1c2833;
        }
        body.space-mode { --bg-color: #0f172a; --text-color: #f8fafc; --shadow-light: #1e293b; --shadow-dark: #020617; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; transition: all 0.5s ease; }
        .app-container { width: 100%; height: 100%; max-width: 500px; padding: 20px; background-color: var(--bg-color); box-shadow: var(--neu-distance) var(--neu-distance) var(--neu-blur) var(--shadow-dark), calc(-1 * var(--neu-distance)) calc(-1 * var(--neu-distance)) var(--neu-blur) var(--shadow-light); border-radius: var(--border-radius); overflow-y: auto; position: relative; }
        .game-setup-screen { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .input-group { width: 100%; max-width: 350px; margin-bottom: 15px; }
        .neumorphic-input { width: 100%; padding: 12px; border: none; border-radius: var(--border-radius); background: var(--bg-color); color: var(--text-color); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); outline: none; }
        .setup-option { width: 100%; max-width: 350px; margin-bottom: 15px; }
        .neumorphic-select-container { position: relative; background: var(--bg-color); border-radius: var(--border-radius); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }
        .neumorphic-select-container select { width: 100%; padding: 12px; border: none; background: transparent; color: var(--text-color); appearance: none; cursor: pointer; }
        .game-content { display: none; flex-direction: column; align-items: center; width: 100%; }
        header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .icon-btn { padding: 10px; cursor: pointer; border-radius: 50%; box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light); }
        .score-board { display: flex; justify-content: space-around; width: 100%; padding: 15px; border-radius: var(--border-radius); box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); margin-bottom: 20px; }
        .game-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 300px; height: 300px; }
        .cell { background: var(--bg-color); border-radius: var(--border-radius); display: flex; justify-content: center; align-items: center; font-size: 2.5em; font-weight: bold; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); cursor: pointer; }
        .neumorphic-button { padding: 12px 25px; border-radius: var(--border-radius); border: none; background: var(--bg-color); box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); cursor: pointer; font-weight: 600; color: var(--text-color); }
        .neumorphic-button.primary { background: linear-gradient(135deg, var(--primary-accent-color-x-dark), var(--primary-accent-color-x)); color: white; }
        .side-menu { position: fixed; top: 0; right: -300px; width: 260px; height: 100%; background: var(--bg-color); transition: 0.3s; z-index: 1000; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.2); }
        .side-menu.open { right: 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
        .overlay.active { display: block; }
        .toggle-switch { display: flex; border-radius: 10px; overflow: hidden; box-shadow: inset 2px 2px 5px var(--shadow-dark); margin-top: 5px; }
        .toggle-switch button { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-color); cursor: pointer; }
        .toggle-switch button.active { background: var(--primary-accent-color-x); color: white; }
        .weather-particle { position: fixed; pointer-events: none; z-index: 999; }
        @keyframes fall { to { top: 110vh; } }
        .snowflake { top: -10px; background: white; border-radius: 50%; animation: fall linear infinite; }
    </style>
</head>
<body class="light-theme">

    <audio id="backgroundMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="app-container">
        <div class="game-setup-screen" id="gameSetupScreen">
            <h2 style="margin-bottom: 20px;" data-translate="setupGame">Setup Game</h2>
            <div class="input-group">
                <label data-translate="p1Name">Player X Name</label>
                <input type="text" id="playerXName" class="neumorphic-input" placeholder="Rahim">
            </div>
            <div class="input-group">
                <label data-translate="p2Name">Player O Name</label>
                <input type="text" id="playerOName" class="neumorphic-input" placeholder="AI Bot">
            </div>
            <div class="setup-option">
                <label data-translate="skin">Board Theme</label>
                <div class="neumorphic-select-container">
                    <select id="skinSelect">
                        <option value="classic">Classic</option>
                        <option value="emoji">Emoji</option>
                        <option value="neon">Neon</option>
                    </select>
                </div>
            </div>
            <div class="setup-option">
                <label data-translate="gameMode">Game Mode</label>
                <div class="neumorphic-select-container">
                    <select id="gameModeSelect">
                        <option value="pvp">Player vs Player</option>
                        <option value="pve">Player vs AI</option>
                    </select>
                </div>
            </div>
            <button class="neumorphic-button primary" id="startGameButton" style="width: 100%; margin-top: 20px;" data-translate="startGame">Start Game</button>
        </div>

        <div class="game-content" id="gameContent">
            <header>
                <div class="icon-btn" id="homeButton"><i class="fas fa-home"></i></div>
                <h1 id="headerTitle">Tic Tac Toe</h1>
                <div class="icon-btn" id="hamburgerIcon"><i class="fas fa-bars"></i></div>
            </header>
            <div class="score-board">
                <div id="scoreXContainer"><span id="displayXName">X</span>: <span id="scoreX">0</span></div>
                <div>Draws: <span id="scoreDraw">0</span></div>
                <div id="scoreOContainer"><span id="displayOName">O</span>: <span id="scoreO">0</span></div>
            </div>
            <div id="statusDisplay" style="margin-bottom: 20px; font-weight: bold;"></div>
            <div class="game-board" id="gameBoard"></div>
            <button class="neumorphic-button" id="resetButton" style="margin-top: 30px;">Reset Board</button>
        </div>
    </div>

    <nav class="side-menu" id="sideMenu">
        <h3 style="margin-bottom: 20px;">Settings</h3>
        <div style="margin-bottom: 15px;">
            <span data-translate="music">Music</span>
            <div class="toggle-switch">
                <button id="musicOn" class="active">On</button>
                <button id="musicOff">Off</button>
            </div>
        </div>
        <button class="neumorphic-button" id="closeMenuBtn" style="width: 100%;">Close</button>
    </nav>
    <div class="overlay" id="overlay"></div>

    <script>
        const translations = {
            en: { setupGame: "Setup Game", p1Name: "Player X Name", p2Name: "Player O Name", skin: "Theme", gameMode: "Mode", startGame: "Start Game", music: "Music" },
            bn: { setupGame: "গেম সেটআপ", p1Name: "খেলোয়াড় X", p2Name: "খেলোয়াড় O", skin: "থিম", gameMode: "মোড", startGame: "শুরু করুন", music: "মিউজিক" }
        };

        document.addEventListener('DOMContentLoaded', () => {
            let musicEnabled = true;
            let gameActive = false;
            let boardState = Array(9).fill("");
            let currentPlayer = "X";
            const bgMusic = document.getElementById('backgroundMusic');

            // --- মিউজিক ফাংশন ---
            function playMusic() {
                if (musicEnabled && !gameActive) {
                    bgMusic.volume = 0.4;
                    bgMusic.play().catch(() => console.log("Interaction needed"));
                }
            }

            function stopMusic() {
                bgMusic.pause();
                bgMusic.currentTime = 0;
            }

            // প্রথম ক্লিকের পর মিউজিক শুরু করার জন্য (অটো-প্লে ফিক্স)
            document.body.addEventListener('click', () => {
                if (!gameActive) playMusic();
            }, { once: true });

            // গেম শুরু
            document.getElementById('startGameButton').addEventListener('click', () => {
                gameActive = true;
                stopMusic(); // গেম শুরু হলে মিউজিক বন্ধ
                document.getElementById('gameSetupScreen').style.display = 'none';
                document.getElementById('gameContent').style.display = 'flex';
                startNewGame();
            });

            // হোম বাটনে ক্লিক
            document.getElementById('homeButton').addEventListener('click', () => {
                gameActive = false;
                document.getElementById('gameContent').style.display = 'none';
                document.getElementById('gameSetupScreen').style.display = 'flex';
                playMusic(); // হোমে ফিরলে গান শুরু
            });

            // মিউজিক অন/অফ সেটিংস
            document.getElementById('musicOn').addEventListener('click', () => {
                musicEnabled = true;
                document.getElementById('musicOn').classList.add('active');
                document.getElementById('musicOff').classList.remove('active');
                if (!gameActive) playMusic();
            });

            document.getElementById('musicOff').addEventListener('click', () => {
                musicEnabled = false;
                document.getElementById('musicOn').classList.remove('active');
                document.getElementById('musicOff').classList.add('active');
                stopMusic();
            });

            // মেনু কন্ট্রোল
            document.getElementById('hamburgerIcon').addEventListener('click', () => {
                document.getElementById('sideMenu').classList.add('open');
                document.getElementById('overlay').classList.add('active');
            });

            document.getElementById('closeMenuBtn').addEventListener('click', () => {
                document.getElementById('sideMenu').classList.remove('open');
                document.getElementById('overlay').classList.remove('active');
            });

            // গেম বোর্ড লজিক (সংক্ষেপে)
            function startNewGame() {
                boardState.fill("");
                currentPlayer = "X";
                const board = document.getElementById('gameBoard');
                board.innerHTML = '';
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.addEventListener('click', () => {
                        if (boardState[i] === "") {
                            boardState[i] = currentPlayer;
                            cell.textContent = currentPlayer;
                            currentPlayer = currentPlayer === "X" ? "O" : "X";
                            document.getElementById('statusDisplay').textContent = `${currentPlayer}'s Turn`;
                        }
                    });
                    board.appendChild(cell);
                }
                document.getElementById('statusDisplay').textContent = "X's Turn";
            }
        });
    </script>
</body>
</html>
